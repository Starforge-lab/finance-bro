name: Android development APK

on:
  workflow_dispatch:
    inputs:
      libsodium_source_check:
        description: Compile the pinned recovery crypto source instead of an APK
        type: boolean
        default: false
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/android-development.yml
      - apps/mobile/app.config.ts
      - apps/mobile/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**

permissions:
  contents: read

concurrency:
  group: android-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.libsodium_source_check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_VARIANT: development
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/mobile exec expo prebuild --platform android --no-install
      - name: Build ARM64 development client
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-bro-dev-arm64
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  libsodium-source:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.libsodium_source_check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y minisign
      - name: Fetch source and signature
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output libsodium-1.0.22-stable.tar.gz https://download.libsodium.org/libsodium/releases/libsodium-1.0.22-stable.tar.gz
          curl --fail --location --retry 3 --output libsodium-1.0.22-stable.tar.gz.minisig https://download.libsodium.org/libsodium/releases/libsodium-1.0.22-stable.tar.gz.minisig
      - name: Compile and inspect ARM64 library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/30.0.16248370"
          bash scripts/spikes/build-libsodium-arm64.sh "$RUNNER_TEMP/libsodium-1.0.22-stable.tar.gz" "$RUNNER_TEMP/libsodium-source-check"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libsodium-source-arm64
          path: |
            ${{ runner.temp }}/libsodium-source-check/*.txt
            ${{ runner.temp }}/libsodium-source-check/LICENSE.libsodium
            ${{ runner.temp }}/libsodium-source-check/libsodium-stable/libsodium-android-armv8-a+crypto/lib/libsodium.so
          retention-days: 1
          if-no-files-found: error
