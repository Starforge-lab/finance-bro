name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node apps/mobile/modules/sms-reader/self-check.cjs
      - name: Check Android unsigned release config plugin
        run: node --test apps/mobile/test/with-unsigned-android-release.test.cjs
      - name: Check dependencies against the installed Expo SDK
        run: pnpm exec expo install --check
        working-directory: apps/mobile
        env:
          EXPO_OFFLINE: "1"
      - name: Run Expo Doctor against the frozen SDK
        run: pnpm dlx expo-doctor
        working-directory: apps/mobile
        env:
          EXPO_OFFLINE: "1"
      - run: pnpm build
